name: Runtime Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish.
        required: false
        default: "0.1.0"
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - scripts/**
      - tests/**
      - .github/workflows/runtime-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ai-devbox-codex-runtime
  CODEX_VERSION: "0.133.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag || '' }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${INPUT_TAG:-0.1.0}"
          image="ghcr.io/${owner}/${IMAGE_NAME}:${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            CODEX_VERSION=${{ env.CODEX_VERSION }}
          platforms: linux/amd64

      - name: Smoke test
        run: docker run --rm --entrypoint /opt/ai-devbox/tests/smoke.sh "${{ steps.meta.outputs.image }}"

      - name: Push runtime image
        run: docker push "${{ steps.meta.outputs.image }}"
